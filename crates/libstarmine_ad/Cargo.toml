[package]
name = "libstarmine_ad"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
bitstream-io = "4.3.0"
log = "0.4.27"
rustfft = "6.4"
thiserror = "2.0.14"

[lib]
name = "starmine_ad"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "starmine-ad-cli"
path = "src/bin/starmine-ad-cli/main.rs"
